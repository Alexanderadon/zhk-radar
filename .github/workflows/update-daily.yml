# ЖК-Радар — ежедневный сбор квартир в облаке (вместо Планировщика на ПК).
#
# Почему не Vercel Cron: сбор идёт ~18 минут (6600+ запросов с троттлингом),
# а лимит функции Vercel Hobby — 300 секунд, поднять его нельзя. Плюс в деплой
# нельзя писать файлы. Здесь лимит job'а 6 часов, и мы просто повторяем тот же
# пайплайн, что раньше крутился на ПК: собрать -> положить в public/ -> задеплоить.
#
# Данные (13 МБ) намеренно НЕ коммитятся: они в .gitignore, а на прод их грузит
# Vercel CLI прямо с раннера (.vercelignore это разрешает). Иначе репозиторий
# распухал бы примерно на полтора гигабайта в год.
name: Ежедневное обновление квартир

on:
  schedule:
    # 19:00 UTC = 00:00 по Алматы (UTC+5).
    # GitHub не гарантирует точную минуту: при нагрузке запуск сдвигается.
    - cron: '0 19 * * *'
  workflow_dispatch: {} # кнопка «запустить сейчас» в интерфейсе

concurrency:
  group: update-daily
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Скрапер считает «продано/новых» диффом с прошлым снимком. На чистом
      # раннере его нет, поэтому берём текущий снимок с прода — он и есть
      # результат предыдущего запуска.
      # матрица городов: слуг krisha, рамка и имя файла.
      # Капчагай на krisha называется konaev — поэтому имя файла задаётся отдельно.
      - name: Обновить все города
        run: |
          set -e
          mkdir -p data
          update () {
            slug="$1"; n="$2"; w="$3"; s="$4"; e="$5"; key="$6"
            sfx=""; [ "$key" != "almaty" ] && sfx="-$key"
            echo "::group::$key"
            # прошлый снимок с прода — база для диффа «продано / новых»
            curl -sfL "https://zhk-radar.vercel.app/listings$sfx.json"      -o "data/listings$sfx.json"      || echo "$key: снимка нет, первый запуск"
            curl -sfL "https://zhk-radar.vercel.app/listings-sold$sfx.json" -o "data/listings-sold$sfx.json" || true
            node scripts/collect-listings.mjs "$slug" "$n" "$w" "$s" "$e" "$key"
            cp "data/listings$sfx.json"      "public/listings$sfx.json"
            cp "data/listings-meta$sfx.json" "public/listings-meta$sfx.json"
            cp "data/listings-sold$sfx.json" "public/listings-sold$sfx.json"
            cat "public/listings-meta$sfx.json"
            echo "::endgroup::"
          }
          update almaty      43.40 76.70 43.05 77.20 almaty
          update astana      51.25 71.20 51.00 71.70 astana
          update shymkent    42.42 69.48 42.22 69.78 shymkent
          update taldykorgan 45.07 78.28 44.94 78.47 taldykorgan
          update konaev      43.93 76.98 43.80 77.15 kapchagay

      - name: Деплой на Vercel
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx --yes vercel@59.11.7 deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }}

      # Если сбор упал — это должно быть видно, а не тонуть в логах, как
      # случилось с Планировщиком: он молча не отрабатывал с 27 августа.
      - name: Пометить провал
        if: failure()
        run: echo "::error::Ежедневное обновление квартир не отработало"
